name: Update fuel data

on:
  schedule:
    - cron: '0 5,11,17 * * *'   # 3× daily — 5am, 11am, 5pm UTC (8am, 2pm, 8pm Riga)
  workflow_dispatch:              # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape prices
        run: python scraper/scrape_prices.py

      - name: Scrape news
        run: python scraper/scrape_news.py

      - name: Generate AI recommendation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper/generate_recommendation.py

      - name: Commit updated data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update fuel data [skip ci]'
          file_pattern: 'output/src/data/*.json'
