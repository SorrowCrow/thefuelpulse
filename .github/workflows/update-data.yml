name: Update fuel data

on:
  schedule:
    - cron: '0 2,8,14 * * *'   # 3x daily — 5am, 11am, 5pm Riga (EEST UTC+3, summer)
    # NOTE: Latvia uses EEST (UTC+3) late-Mar→late-Oct, EET (UTC+2) otherwise.
    # Switch to '0 3,9,15 * * *' in winter to keep 5am/11am/5pm Riga time.
  workflow_dispatch:              # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape prices
        run: python scraper/scrape_prices.py

      - name: Scrape news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper/scrape_news.py

      - name: Generate AI recommendation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper/generate_recommendation.py

      - name: Commit updated data files
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update fuel data'
          file_pattern: 'output/src/data/*.json'

      - name: Notify Telegram
        if: steps.auto-commit.outputs.changes_detected == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper/notify_telegram.py

      - name: Send price alert emails
        if: steps.auto-commit.outputs.changes_detected == 'true'
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scraper/send_price_alert.py
