name: Update fuel data

on:
  schedule:
    - cron: '0 3,9,15 * * *'   # 3× daily — 3am, 9am, 3pm UTC (5am, 12pm, 6pm Riga)
  workflow_dispatch:              # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape prices
        run: python scraper/scrape_prices.py

      - name: Scrape news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper/scrape_news.py

      - name: Generate AI recommendation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper/generate_recommendation.py

      - name: Commit updated data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update fuel data'
          file_pattern: 'output/src/data/*.json'
