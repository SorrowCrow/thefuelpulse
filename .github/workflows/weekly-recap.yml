name: Generate weekly recap

on:
  schedule:
    - cron: '0 7 * * 1'    # Every Monday at 7am UTC (10am Riga) — after weekend data is in
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  recap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Generate weekly recap articles
        run: python scraper/generate_weekly_recap.py

      - name: Commit recap articles
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'content: add weekly fuel price recap'
          file_pattern: 'output/src/content/articles/**/*.md'
